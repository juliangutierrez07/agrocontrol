name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  php-lint:
    name: Validar sintaxis PHP
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar PHP 8.1
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
          coverage: none

      - name: php -l en cada archivo .php
        run: |
          set -e
          fallo=0
          while IFS= read -r -d '' archivo; do
            php -l "$archivo" || fallo=1
          done < <(find . -type f -name "*.php" -not -path "./vendor/*" -print0)
          exit "$fallo"

  secret-scan:
    name: Buscar secretos hardcodeados obvios
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Grep de patrones de secretos de alta confianza
        run: |
          set -e
          # Patrones de FORMATO conocido (AWS, clave privada, Slack, Google,
          # GitHub, JWT), no palabras genéricas como "password=" o "secret:".
          # Se probó un patrón genérico primero y dio un falso positivo real
          # en Pages/usuarios.php (mapa de mensajes de UI con la clave
          # 'password'), así que se descartó a favor de estos formatos
          # específicos, que no tuvieron falsos positivos en el repo.
          PATRONES='AKIA[0-9A-Z]{16}|-----BEGIN[A-Z ]*PRIVATE KEY-----|xox[baprs]-[0-9A-Za-z-]+|AIza[0-9A-Za-z_-]{35}|ghp_[0-9A-Za-z]{36}|eyJ[A-Za-z0-9_-]{10,}\.eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}'
          if grep -rEn --exclude-dir=.git --exclude=.env.example -e "$PATRONES" .; then
            echo "::error::Se encontraron posibles secretos hardcodeados (ver líneas señaladas arriba)."
            exit 1
          fi
          echo "Sin coincidencias de patrones de secretos conocidos."

